<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>DANCE — フェーダー即興マシン</title>
<style>
  :root{--bg:#0c0d0f;--panel:#16181b;--line:#25282d;--text:#ececee;--sub:#8d9097}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{overscroll-behavior:none}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;font-size:14px;-webkit-user-select:none;user-select:none}
  .wrap{max-width:560px;margin:0 auto;padding:0 10px 40px}
  button,select{background:#24272c;color:var(--text);border:1px solid #34383f;border-radius:9px;padding:9px 12px;font-size:14px;font-family:inherit}
  button:active{transform:scale(.97)}
  .top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px}
  .row{display:flex;gap:8px;align-items:center}
  #play{min-width:72px;font-weight:800;padding:9px 8px}
  #play.on{background:#ececee;color:#111}
  .vb{padding:9px 8px}.vb.on{background:#ececee;color:#111}
  .meter{flex:1;display:grid;grid-template-columns:repeat(16,1fr);gap:2px}
  .meter div{height:22px;border-radius:3px;background:#1f2226}
  .meter div.bar{background:#2b2f35}
  .meter div.cur{background:#fff}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:10px}
  .sec{color:var(--sub);font-size:12px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .sec b{color:var(--text);font-size:13px}
  .hide{display:none!important}
  .hint{font-size:11px;color:var(--sub);line-height:1.6;margin-top:8px}

  /* ミキサー */
  .mixer{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .ch{display:flex;flex-direction:column;align-items:center;gap:5px;background:#121416;border:1px solid #22252a;border-radius:12px;padding:6px 2px 6px}
  .ch.sel{border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset}
  .ch .nm{font-size:11px;font-weight:800;color:var(--c);letter-spacing:.02em;white-space:nowrap}
  .ch canvas{width:40px;height:40px}
  .fader{position:relative;width:100%;height:210px;touch-action:none;cursor:pointer}
  .fader .slot{position:absolute;left:50%;top:6px;bottom:6px;width:6px;margin-left:-3px;border-radius:3px;background:#050607;box-shadow:inset 0 1px 2px #000}
  .fader .fill{position:absolute;left:50%;bottom:6px;width:6px;margin-left:-3px;border-radius:3px;background:var(--c);opacity:.85}
  .fader .tick{position:absolute;left:50%;width:22px;margin-left:-11px;height:1px;background:#3a3e45}
  .fader .ghost{position:absolute;left:50%;width:38px;height:22px;margin-left:-19px;border-radius:5px;border:2px dashed var(--c);opacity:.9}
  .fader .cap{position:absolute;left:50%;width:38px;height:22px;margin-left:-19px;border-radius:5px;background:linear-gradient(#e9e9eb,#a9abb0);box-shadow:0 2px 4px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}
  .fader .cap::after{content:"";width:26px;height:2px;background:#222}
  .ch .pn{font-size:10px;color:var(--text);text-align:center;line-height:1.2;height:2.4em;overflow:hidden;width:100%;padding:0 2px}
  .ch .pn.wait{color:var(--c)}
  .ch .mute{width:40px;padding:5px 0;font-size:11px;font-weight:800}
  .ch .mute.on{background:#4a1d22;color:#ff8a95;border-color:#7a2630}

  /* マクロ */
  .macro{display:grid;grid-template-columns:4.8em 1fr 3.4em;gap:2px 8px;align-items:center}
  .macro span{font-size:12px;color:var(--sub)}
  .macro span.v{color:var(--text);text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;height:34px;accent-color:#ececee}
  .hold{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
  .hold button{padding:15px 0;font-weight:800;font-size:15px;touch-action:none}
  .hold button.on{background:#ececee;color:#111}

  .chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .chip{position:relative;padding:12px 2px;font-size:12px;border-radius:10px}
  .chip.on{background:var(--c,#ececee);color:#111;border-color:transparent;font-weight:700}
  .chip .no{position:absolute;top:3px;left:5px;font-size:10px;font-weight:800;opacity:.7}
  .steps{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;margin-top:8px}
  .steps button{padding:0;height:34px;border-radius:5px;background:#202327}
  .steps button:nth-child(4n+1){background:#2a2e34}
  .steps button.on{background:var(--c)}
  .steps button.now{outline:2px solid #fff}
  .roll{display:grid;grid-template-columns:2.2em repeat(16,1fr);gap:2px;margin-top:8px}
  .roll span{font-size:9px;color:var(--sub);display:flex;align-items:center}
  .roll button{padding:0;height:17px;border-radius:3px;background:#1d2024;border:none}
  .roll button.c4{background:#262a2f}
  .roll button.rt{background:#2c3138}
  .roll button.on{background:var(--c)}
  .roll button.now{box-shadow:inset 0 0 0 1px #fff}
  .seg{display:flex;gap:4px}.seg button{flex:1;padding:8px 0;font-size:13px}
  .seg button.on{background:#ececee;color:#111;font-weight:700}

  #rec{flex:1;padding:16px;font-size:16px;font-weight:800;background:#3a1418;border-color:#7a2630;color:#ff8a95;touch-action:none}
  #rec.on{background:#ff3b4e;color:#fff;animation:blink .4s infinite alternate}
  @keyframes blink{to{opacity:.4}}
  #file{display:none}
  canvas{display:block}
  #clipWave{width:100%}
  .srow,.crow{display:flex;gap:6px;align-items:center;margin-top:6px}
  .srow b{flex:1;font-size:14px}
  .srow button,.crow button,.crow select{padding:7px 9px;font-size:13px}
  .crow{position:relative;background:#1d1f23;border-radius:10px;padding:6px;overflow:hidden}
  .crow .no{width:1.6em;color:var(--sub);font-size:12px;text-align:center}
  .crow select.sc{flex:1}
  .crow .pg{position:absolute;left:0;bottom:0;height:3px;background:#f2c14e;width:0}
  .crow.now{outline:2px solid #f2c14e}
  textarea{width:100%;height:80px;background:#0f1012;color:var(--text);border:1px solid #34383f;border-radius:9px;padding:8px;font-size:11px;font-family:ui-monospace,monospace;-webkit-user-select:text;user-select:text}
  .chk{display:flex;align-items:center;gap:8px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="row">
      <button id="play">▶ 再生</button>
      <div class="meter" id="meter"></div>
      <button id="recTab" class="vb">🎙</button><button id="flowTab" class="vb">🎬</button><button id="gear" class="vb">⚙</button>
    </div>
  </div>

  <div id="mainView">
    <div class="seg" id="genre" style="margin-bottom:8px"><button data-g="fh">フレンチハウス</button><button data-g="bh">ベースハウス</button></div>
    <div class="mixer" id="mixer"></div>
    <div class="hold">
      <button id="hBreak">ブレイク</button><button id="hRoll">ロール</button><button id="hStut">スタッター</button>
    </div>
    <div class="panel">
      <div class="macro">
        <span>フィルター</span><input type="range" id="mFilt" min="-100" max="100" value="0"><span class="v" id="mFiltV">オフ</span>
        <span>ポンプ</span><input type="range" id="mPump" min="0" max="100" value="55"><span class="v" id="mPumpV">55</span>
        <span>エコー</span><input type="range" id="mEcho" min="0" max="100" value="25"><span class="v" id="mEchoV">25</span>
        <span>歪み</span><input type="range" id="mDrive" min="0" max="100" value="0"><span class="v" id="mDriveV">0</span>
      </div>
    </div>
    <div class="panel" id="detail">
      <div class="sec"><b id="dName"></b><span id="dDesc"></span></div>
      <div id="dAlts" class="seg"></div>
      <div id="dPicks" class="chips" style="margin-top:8px"></div>
      <div id="dSteps" class="steps"></div>
      <div id="dRoll" class="hide">
        <div class="row" style="margin-top:8px"><div class="seg" id="rBar" style="flex:1"><button data-b="0">1小節目</button><button data-b="1">2小節目</button></div><div class="seg" id="rOct" style="flex:1"><button data-o="-12">低</button><button data-o="0">中</button><button data-o="12">高</button></div></div>
        <div id="roll" class="roll"></div>
        <div class="row" style="margin-top:6px"><button id="rCopy" style="flex:1">1小節目を2小節目にコピー</button><button id="rClear">全消し</button></div>
        <div class="macro" style="margin-top:4px"><span>音の長さ</span><input type="range" id="dGate" min="15" max="200"><span class="v" id="dGateV"></span></div>
      </div>
      <div class="macro" style="margin-top:6px"><span>音量</span><input type="range" id="dVol" min="0" max="100"><span class="v" id="dVolV"></span></div>
      <div class="hint" id="dHint"></div>
    </div>
  </div>

  <div id="recView" class="hide">
    <div class="panel">
      <div class="sec"><b>🎙 録音</b><span>録った音は「声・ネタ」で使えます</span></div>
      <div class="row"><button id="rec">● 押している間だけ録音</button></div>
      <div class="row" style="margin-top:6px"><button id="pickFile" style="flex:1">📁 ファイルから追加</button></div>
      <input type="file" id="file">
      <div class="hint" id="userHint"></div>
    </div>
    <div class="panel">
      <div class="sec"><b>録った音</b><span id="clipCount"></span></div>
      <div class="chips" id="clipList"></div>
    </div>
    <div class="panel" id="editor">
      <div class="sec"><b id="clipName">編集</b><span>白い端をドラッグして使う部分を決める</span></div>
      <canvas id="clipWave" height="140" style="touch-action:none"></canvas>
      <div class="row" style="margin-top:8px">
        <button id="cPlay" style="flex:1">▶ 試聴</button><button id="cRev" style="flex:1">⇆ 反転</button><button id="cSplit" style="flex:1">✂ 分割</button><button id="cDel">🗑</button>
      </div>
    </div>
  </div>

  <div id="flowView" class="hide">
    <div class="panel">
      <div class="sec"><b>🎬 シーン</b><span>今のフェーダー位置を丸ごと保存</span></div>
      <button id="sceneAdd" style="width:100%;background:#ececee;color:#111;font-weight:700">＋ 今の状態をシーンとして保存</button>
      <div id="sceneList" style="margin-top:8px"></div>
    </div>
    <div class="panel">
      <div class="sec"><b>流れ(シーンの再生順)</b><label class="chk" style="font-size:12px"><input type="checkbox" id="chainLoop" checked> 繰り返す</label></div>
      <div id="chainList"></div>
      <button id="stepAdd" style="width:100%;margin-top:8px">＋ ステップを追加</button>
      <button id="chainPlay" style="width:100%;margin-top:8px;background:#f2c14e;color:#111;border:none;font-weight:800;padding:13px">▶ 流れを再生</button>
      <div class="hint">各ステップは指定した長さだけ鳴り、ぴったり次のシーンへ切り替わります。</div>
    </div>
  </div>

  <div id="globalView" class="hide">
    <div class="panel">
      <div class="sec"><b>全体設定</b></div>
      <div class="macro"><span>テンポ</span><input type="range" id="bpm" min="90" max="140" value="122"><span class="v" id="bpmV">122</span></div>
      <div class="sec" style="margin-top:12px"><span>キー(ベースとコードの高さ)</span></div>
      <select id="key" style="width:100%"></select>
      <div class="sec" style="margin-top:12px"><span>フェーダーを動かした内容が切り替わるタイミング</span></div>
      <div class="seg" id="quant"><button data-q="4">次の拍</button><button data-q="16">次の小節</button><button data-q="32">2小節</button></div>
      <div class="sec" style="margin-top:16px"><b>保存と読み込み</b></div>
      <button id="exportBtn" style="width:100%">今の設定を文字にしてコピー</button>
      <textarea id="saveText" placeholder="コピーした文字を貼り付けて「読み込む」" style="margin-top:6px"></textarea>
      <button id="importBtn" style="width:100%;margin-top:6px">読み込む</button>
      <div class="hint" id="saveMsg">最後の状態はこの端末にも自動で残ります。録った音そのものは保存されません。</div>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const clone=o=>JSON.parse(JSON.stringify(o));
const LIB={drums:[],bass:[],chords:[],fx:[],bh:[],user:[]};
let ctx=null;
async function renderSound(dur,fn){
  const sr=44100,OC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
  const oc=new OC(1,Math.ceil(sr*dur),sr);
  const nb=oc.createBuffer(1,sr,sr),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  const out=oc.createGain();out.connect(oc.destination);
  const E=(g,t,v,dec,att=.003)=>{g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+att+dec)};
  const N=(t,o)=>{const s=oc.createBufferSource();s.buffer=nb;s.loop=true;const f=oc.createBiquadFilter();f.type=o.type||'bandpass';f.frequency.setValueAtTime(o.f,t);if(o.fEnd)f.frequency.exponentialRampToValueAtTime(o.fEnd,t+(o.fTime||o.dec));f.Q.value=o.q||.7;const g=oc.createGain();if(o.rise){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(o.v,t+o.dec);g.gain.linearRampToValueAtTime(0,t+o.dec+.02)}else E(g,t,o.v,o.dec);s.connect(f).connect(g).connect(o.to||out);s.start(t);s.stop(t+o.dec+.05)};
  const O=(t,o)=>{const x=oc.createOscillator();x.type=o.type||'sine';x.frequency.setValueAtTime(o.f,t);if(o.fEnd)x.frequency.exponentialRampToValueAtTime(o.fEnd,t+(o.fTime||o.dec));if(o.det)x.detune.value=o.det;let n=x;if(o.lp){const f=oc.createBiquadFilter();f.type='lowpass';f.Q.value=o.q||1;f.frequency.setValueAtTime(o.lp,t);if(o.lpEnd)f.frequency.exponentialRampToValueAtTime(o.lpEnd,t+(o.lpTime||o.dec));x.connect(f);n=f}const g=oc.createGain();E(g,t,o.v,o.dec,o.att);n.connect(g).connect(o.to||out);x.start(t);x.stop(t+(o.att||0)+o.dec+.05);return x};
  const D=(amt)=>{const w=oc.createWaveShaper();w.curve=shapeCurve(amt);w.oversample='2x';w.connect(out);return w};
  fn({oc,O,N,out,D});
  const buf=await oc.startRendering(),d=buf.getChannelData(0);
  let m=0;for(let i=0;i<d.length;i++)m=Math.max(m,Math.abs(d[i]));
  const k=.9/(m||1);for(let i=0;i<d.length;i++)d[i]*=k;
  return buf;
}
function shapeCurve(amt){const n=1024,c=new Float32Array(n),k=1+amt*12;for(let i=0;i<n;i++){const x=i/(n-1)*2-1;c[i]=Math.tanh(x*k)/Math.tanh(k)}return c}
const saws=(O,t,f,o)=>[-14,0,14].forEach(det=>O(t,{type:'sawtooth',f,det,...o}));
const chord=(O,ns,o)=>ns.forEach(f=>saws(O,0,f,o));
const rhodes=({oc,O},ns)=>ns.forEach(f=>{const m=oc.createOscillator(),mg=oc.createGain();m.frequency.value=f*2;mg.gain.setValueAtTime(f*1.2,0);mg.gain.exponentialRampToValueAtTime(1,.8);m.connect(mg);const c=O(0,{f,v:.22,dec:1.3,att:.004});mg.connect(c.frequency);m.start(0);m.stop(1.4)});
const robot=({oc,out},f0,fs,dur=.5)=>{[1,2].forEach((mul,mi)=>{const x=oc.createOscillator();x.type=mi?'square':'sawtooth';x.frequency.value=f0*mul;const g=oc.createGain();g.gain.setValueAtTime(.0001,0);g.gain.linearRampToValueAtTime(mi?.15:.6,.03);g.gain.setValueAtTime(mi?.15:.6,dur-.06);g.gain.linearRampToValueAtTime(0,dur);fs.forEach((ff,i)=>{const f=oc.createBiquadFilter();f.type='bandpass';f.frequency.value=ff;f.Q.value=10-i*2;x.connect(f).connect(g)});g.connect(out);x.start(0);x.stop(dur)})};
const funk=(f)=>({O,N})=>{O(0,{type:'square',f,v:.35,dec:.22,lp:2200,lpEnd:220,lpTime:.18,q:7});O(0,{f,v:.6,dec:.25});O(0,{type:'sawtooth',f:f*2,v:.08,dec:.05,lp:4000})};
const dirty=(f)=>({O,D})=>{const d=D(.9);O(0,{type:'sawtooth',f,v:.5,dec:.32,att:.004,lp:3500,lpEnd:400,q:3,to:d});O(0,{type:'square',f:f*1.005,v:.3,dec:.32,att:.004,lp:2500,lpEnd:300,to:d});O(0,{f:f/2,v:.5,dec:.3})};
const cut=(ns)=>({O,N})=>{N(0,{f:2500,q:1.5,v:.35,dec:.03});ns.forEach(f=>O(0,{type:'sawtooth',f,v:.09,dec:.09,lp:4500,lpEnd:900}))};
const DEFS={
  drums:[
    ['キック','K',.45,({O,N,D})=>{const d=D(.25);O(0,{f:170,fEnd:50,fTime:.08,v:1,dec:.38,to:d});N(0,{type:'highpass',f:2500,v:.4,dec:.01})}],
    ['歪みキック','K2',.45,({O,N,D})=>{const d=D(1);O(0,{f:200,fEnd:48,fTime:.07,v:1,dec:.35,to:d});N(0,{type:'bandpass',f:1500,v:.5,dec:.02,to:d})}],
    ['クラップ','CP',.35,({N})=>{[0,.01,.02].forEach(d=>N(d,{f:1250,q:1.3,v:.55,dec:.03}));N(.03,{f:1150,q:1,v:.5,dec:.25})}],
    ['ディスコスネア','SN',.35,({O,N})=>{N(0,{f:2600,q:.5,v:.6,dec:.25});O(0,{type:'triangle',f:190,fEnd:160,v:.5,dec:.1})}],
    ['閉ハット','CH',.08,({N})=>N(0,{type:'highpass',f:9000,v:.4,dec:.04})],
    ['開ハット','OH',.4,({N})=>{N(0,{type:'highpass',f:7500,v:.45,dec:.3});N(0,{f:11000,q:1,v:.15,dec:.25})}],
    ['タンバリン','TB',.2,({N})=>{[0,.012].forEach(d=>N(d,{type:'highpass',f:7000,v:.35,dec:.1,q:2}))}],
    ['シェイカー','SH',.12,({N})=>N(0,{type:'highpass',f:6000,v:.35,dec:.06,q:.5})],
    ['スナップ','SP',.15,({N})=>N(0,{f:3000,q:4,v:.6,dec:.05})],
    ['タム','TM',.4,({O})=>O(0,{f:180,fEnd:100,v:.8,dec:.35})],
    ['クラッシュ','CR',1.6,({N})=>{N(0,{type:'highpass',f:5000,v:.5,dec:1.5});N(0,{f:3000,q:.4,v:.2,dec:.6})}],
    ['リム','RM',.08,({O,N})=>{O(0,{type:'square',f:820,v:.4,dec:.03,lp:2500});N(0,{f:3500,q:3,v:.2,dec:.02})}],
  ],
  bass:[
    ['ファンクA','A',.3,funk(55)],
    ['ファンクC','C',.3,funk(65.4)],
    ['ファンクD','D',.3,funk(73.4)],
    ['ファンクG','G',.3,funk(49)],
    ['ファンク高A','A↑',.3,funk(110)],
    ['歪みA','XA',.35,dirty(55)],
    ['歪みE','XE',.35,dirty(82.4)],
    ['歪みスライド','XS',.45,({O,D})=>{const d=D(1);O(0,{type:'sawtooth',f:110,fEnd:55,fTime:.3,v:.5,dec:.42,lp:3000,lpEnd:500,q:4,to:d});O(0,{f:55,v:.4,dec:.4})}],
  ],
  chords:[
    ['ストリングスAm','S1',.9,({O})=>chord(O,[220,261.6,329.6,440],{v:.04,dec:.6,att:.06,lp:3800,q:1})],
    ['ストリングスF','S2',.9,({O})=>chord(O,[174.6,220,261.6,349.2],{v:.04,dec:.6,att:.06,lp:3800,q:1})],
    ['ブラスAm','B1',.35,({O})=>chord(O,[220,261.6,329.6],{v:.06,dec:.25,att:.01,lp:400,lpEnd:3000,lpTime:.06,q:3})],
    ['ブラスG','B2',.35,({O})=>chord(O,[196,246.9,293.7],{v:.06,dec:.25,att:.01,lp:400,lpEnd:3000,lpTime:.06,q:3})],
    ['ローズAm7','R1',1.4,s=>rhodes(s,[220,261.6,329.6,392])],
    ['ローズDm7','R2',1.4,s=>rhodes(s,[146.8,174.6,220,261.6])],
    ['カッティングAm','G1',.12,cut([220,261.6,329.6,440])],
    ['カッティングD','G2',.12,cut([293.7,370,440,587.3])],
  ],
  fx:[

function ensureCtx(){
  if(ctx)return;

  ctx=new(window.AudioContext||window.webkitAudioContext)();
  const comp=ctx.createDynamicsCompressor();comp.threshold.value=-10;comp.ratio.value=4;comp.attack.value=.004;
  master=ctx.createGain();master.gain.value=.8;

  hpF=ctx.createBiquadFilter();hpF.type='highpass';hpF.frequency.value=10;
  master.connect(lpF).connect(hpF).connect(comp).connect(ctx.destination);
  drumBus=ctx.createGain();drumBus.connect(master);
  pumpG=ctx.createGain();pumpG.connect(master);

  driveDry=ctx.createGain();driveWet=ctx.createGain();
  const sh=ctx.createWaveShaper();sh.curve=shapeCurve(.9);sh.oversample='2x';

  if(!ctx)return;const t=ctx.currentTime,v=state.filt,a=Math.abs(v)/100;
  lpF.frequency.setTargetAtTime(v<0?20000*Math.pow(120/20000,a):20000,t,.03);

const clipPeaks=new WeakMap();
function drawClip(){
  const c=LIB.user[clipSel];if(!c)return;const [g,w,h]=fit($('clipWave'));g.clearRect(0,0,w,h);
  let pk=clipPeaks.get(c.buf);if(!pk){pk=computePeaks(c.buf);clipPeaks.set(c.buf,pk)}
  const d=c.buf.duration,x0=c.off/d*w,x1=(c.off+c.len)/d*w;
  g.fillStyle='#24272c';g.fillRect(0,0,w,h);g.fillStyle='rgba(255,255,255,.06)';g.fillRect(x0,0,x1-x0,h);
  pk.forEach((p,i)=>{const x=i/pk.length*w,ph=Math.max(1,p*h*.85);g.fillStyle=x>=x0&&x<=x1?'#ff6b8b':'#45484f';g.fillRect(x,h/2-ph/2,Math.max(1,w/pk.length-.3),ph)});
  g.fillStyle='#fff';[x0,x1].forEach(x=>{g.fillRect(x-1.5,0,3,h);g.beginPath();g.arc(x,h/2,9,0,7);g.fill()});
}
function addUserSounds(arr){
  arr.forEach(x=>{clipNo++;x.n=x.n||('音'+clipNo)});
  LIB.user=LIB.user.concat(arr).slice(-32);renumber();
  clipSel=LIB.user.length-1;render();
}
$('pickFile').onclick=()=>$('file').click();
$('file').onchange=async ev=>{
  const f=ev.target.files[0];if(!f)return;
  try{
    ensureCtx();const ab=await f.arrayBuffer();
    const buf=await new Promise((res,rej)=>ctx.decodeAudioData(ab,res,rej));
    addUserSounds(splitBySilence(buf).map(([o,len])=>({buf,off:o,len})));
    $('userHint').textContent=`「${f.name}」を区切って追加しました`;
  }catch(err){$('userHint').textContent='このファイルは音声として読み込めませんでした'}
  ev.target.value='';
};
let pressing=false,micStream=null,recNode=null,recChunks=null,recSrc=null;
let micOK=false;
const setSession=t=>{try{if(navigator.audioSession)navigator.audioSession.type=t}catch(_){}};
async function getMic(){
  if(micStream)return micStream;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('nomic');
  setSession('play-and-record');
  micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  return micStream;
}
function releaseMic(){
  if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null}
  setSession('playback');
}
async function recStart(ev){
  ev.preventDefault();pressing=true;
  try{
    ensureCtx();await ctx.resume();
    const first=!micOK;const st=await getMic();
    if(first){micOK=true;releaseMic();$('userHint').textContent='マイクを許可しました。もう一度押している間、録音します。';return}
    if(window.MediaRecorder){
      recMR=new MediaRecorder(st);recChunks=[];
      recMR.ondataavailable=e=>{if(e.data&&e.data.size)recBlobs.push(e.data)};
      recBlobs=[];recMR.start();
    }else{
      recSrc=ctx.createMediaStreamSource(st);recNode=ctx.createScriptProcessor(8192,1,1);recChunks=[];
      const mute=ctx.createGain();mute.gain.value=0;
      recNode.onaudioprocess=e=>{if(recChunks)recChunks.push(new Float32Array(e.inputBuffer.getChannelData(0)))};
      recSrc.connect(recNode).connect(mute).connect(ctx.destination);
    }
    $('rec').classList.add('on');$('rec').textContent='● 録音中… 指を離すと追加';
    if(!pressing)setTimeout(recStop,300);
  }catch(err){
    releaseMic();
    $('userHint').innerHTML='この画面(Claudeの中)ではマイクが使えません。同じページをSafariで単体のページとして開くと、ここで直接録音できます。今は「ファイルから追加」を使ってください。';
  }
}
let recMR=null,recBlobs=[];
function recStop(ev){
  if(ev&&ev.type)pressing=false;
  if(!recChunks)return;ev&&ev.preventDefault&&ev.preventDefault();
  const chunks=recChunks;recChunks=null;
  $('rec').classList.remove('on');$('rec').textContent='● 押している間だけ録音';
  if(recMR){
    const mr=recMR;recMR=null;
    mr.onstop=async()=>{
      releaseMic();
      try{
        const blob=new Blob(recBlobs,{type:mr.mimeType||'audio/mp4'});
        const ab=await blob.arrayBuffer();
        const buf=await new Promise((res,rej)=>ctx.decodeAudioData(ab,res,rej));
        finishRecording(buf);
      }catch(_){$('userHint').textContent='録音データを読み込めませんでした'}
    };
    setTimeout(()=>{try{mr.stop()}catch(_){releaseMic()}},120);
    return;
  }
  try{recSrc.disconnect();recNode.disconnect()}catch(_){}
  releaseMic();
  const n=chunks.reduce((a,c)=>a+c.length,0);if(n<ctx.sampleRate*.05)return;
  const buf=ctx.createBuffer(1,n,ctx.sampleRate),d=buf.getChannelData(0);let o=0;chunks.forEach(c=>{d.set(c,o);o+=c.length});
  finishRecording(buf);
}
function finishRecording(src){
  const sr=src.sampleRate,n=src.length;if(n<sr*.05)return;
  const buf=ctx.createBuffer(1,n,sr),d=buf.getChannelData(0);
  for(let ch=0;ch<src.numberOfChannels;ch++){const c=src.getChannelData(ch);for(let i=0;i<n;i++)d[i]+=c[i]/src.numberOfChannels}
  let mx=0;for(let i=0;i<n;i++)mx=Math.max(mx,Math.abs(d[i]));
  if(mx>0){const k=.9/mx;for(let i=0;i<n;i++)d[i]*=k}
  const th=.06;let a=0,b=n-1;while(a<n&&Math.abs(d[a])<th)a++;while(b>a&&Math.abs(d[b])<th)b--;
  a=Math.max(0,a-Math.floor(sr*.01));b=Math.min(n-1,b+Math.floor(sr*.05));
  if(b<=a){$('userHint').textContent='音が小さすぎて録れませんでした';return}
  addUserSounds([{buf,off:a/sr,len:(b-a)/sr,n:'🎙'+(clipNo+1)}]);
  $('userHint').textContent=`追加しました(${((b-a)/sr).toFixed(2)}秒)`;
  playSound(LIB.user[clipSel],{pitch:0,gate:100,vol:90},ctx.currentTime+.05,'drums');
}
$('rec').addEventListener('pointerdown',recStart);
['pointerup','pointercancel','pointerleave'].forEach(t=>$('rec').addEventListener(t,recStop));
$('rec').addEventListener('contextmenu',e=>e.preventDefault());
function splitBySilence(buf){
  const d=buf.getChannelData(0),sr=buf.sampleRate,win=Math.floor(sr*.01),rms=[];
  for(let i=0;i+win<=d.length;i+=win){let s=0;for(let j=i;j<i+win;j+=2)s+=d[j]*d[j];rms.push(Math.sqrt(s/(win/2)))}
  const mx=Math.max(...rms)||1,th=mx*.08,segs=[];let st=-1,quiet=0;
  rms.forEach((v,i)=>{if(v>th){if(st<0)st=i;quiet=0}else if(st>=0){quiet++;if(quiet>=8){segs.push([st,i-quiet+1]);st=-1;quiet=0}}});
  if(st>=0)segs.push([st,rms.length]);
  let out=segs.filter(([a,b])=>b-a>=4).map(([a,b])=>[Math.max(0,(a-1)*win/sr),Math.min(buf.duration,(b+2)*win/sr)]).map(([o,e])=>[o,e-o]);
  if(out.length>16){out.sort((x,y)=>y[1]-x[1]);out=out.slice(0,16).sort((x,y)=>x[0]-y[0])}
  if(out.length<2){const n=16,sd=buf.duration/n;out=Array.from({length:n},(_,i)=>[i*sd,sd])}
  return out;
}
function fit(cv){const r=devicePixelRatio||1,w=cv.clientWidth,h=+cv.getAttribute('height');if(cv.width!==Math.round(w*r)){cv.width=Math.round(w*r);cv.height=h*r}const c=cv.getContext('2d');c.setTransform(r,0,0,r,0,0);return[c,w,h]}

/* ================= 保存 ================= */
const encode=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const decode=t=>JSON.parse(decodeURIComponent(escape(atob(t.trim()))));
function snapshot(){return{v:10,...snapshotScene(),filt:0,bpm:state.bpm,quant:state.quant,scenes,steps,loop:$('chainLoop').checked}}
function load(o,instant){
  if(!o||!Array.isArray(o.tr))throw 0;
  applyScene(o,instant!==false&&!playing);
  if(o.bpm)state.bpm=o.bpm;if(o.quant)state.quant=o.quant;
  if(Array.isArray(o.scenes)){scenes.length=0;o.scenes.forEach(x=>scenes.push(x))}
  if(Array.isArray(o.steps))steps=o.steps.filter(st=>scenes[st.scene]);
  if(o.loop!=null)$('chainLoop').checked=o.loop;
}
let saveT=0;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem('dance-v11',JSON.stringify(snapshot()))}catch(_){}},400)}
$('exportBtn').onclick=async()=>{const t=encode(snapshot());$('saveText').value=t;
  try{await navigator.clipboard.writeText(t);$('saveMsg').textContent='コピーしました。メモアプリなどに貼って保存してください。'}catch(_){$('saveMsg').textContent='下の文字を長押しして全選択→コピーしてください。'}};
$('importBtn').onclick=()=>{try{load(decode($('saveText').value));render();$('saveMsg').textContent=playing?'読み込みました。次の区切りで切り替わります。':'読み込みました。'}catch(_){$('saveMsg').textContent='読み込めませんでした。'}};

/* ================= 毎フレーム ================= */
function frame(){
  if(ctx&&playing){
    const now=ctx.currentTime;let applied=false;
    while(vis.length&&vis[0].time<=now){
      const ev=vis.shift();
      ev.hits.forEach(ti=>state.tr[ti].hitA=1);
      if(ev.applied)applied=true;
      curStep=ev.s;curOrigin=ev.origin;curBeat=Math.floor((ev.s-ev.origin)/4)%16;
      const was=!!chainUI;chainUI=ev.chain;if(was!==!!chainUI||(ev.chain&&ev.s===ev.chain.start))applied=true;
    }
    if(applied){renderMixer();if(view==='flow')renderFlow()}
  }
  [...meter.children].forEach((d,i)=>d.className=(i%4===0?'bar':'')+(i===curBeat?' cur':''));
  if(view==='main'){drawMini();
    if(TRACKS[sel].id==='bass'&&!$('dRoll').classList.contains('hide')){const r=curStepRel()%32;$('roll').querySelectorAll('button').forEach(b=>b.classList.toggle('now',playing&&+b.dataset.i===r))}
    if(TRACKS[sel].id==='voice'){const r=curStepRel()%16;$('dSteps').querySelectorAll('button').forEach((b,i)=>b.classList.toggle('now',playing&&i===r))}}
  if(view==='rec')drawClip();
  if(view==='flow')flowProgress();
  requestAnimationFrame(frame);
}
try{const o=JSON.parse(localStorage.getItem('dance-v11'));if(o)load(o,true)}catch(_){}
syncMacroUI();applyMacros();
ready.then(()=>render());render();requestAnimationFrame(frame);
window.addEventListener('resize',renderMixer);
</script>
